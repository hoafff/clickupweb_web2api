name: Research tooling CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research requirements
        run: python -m pip install -r requirements-gateway.txt
      - name: Python syntax check
        run: python -m compileall -q tools tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows PowerShell UTF-8 request smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_send_gateway_request.ps1
